<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Титульный слайд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

  <!-- ===== Титульный слайд ===== -->
  <section class="slide slide--title" aria-label="Титульный слайд">
    <div class="title-grid"></div>
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>

    <header class="title-top">
      <div class="brand a fade-in" style="--d:.1"><span class="logo-mark"></span>Название компании</div>
      <div class="a fade-in" style="--d:.2">Департамент операционной эффективности</div>
    </header>

    <div class="title-body">
      <div class="eyebrow a fade-left" style="--d:.3">Бизнес-процесс</div>
      <h1 class="title-main a fade-up" style="--d:.45">Оптимизация процесса <em>закупок</em></h1>
      <div class="title-accent a grow-x" style="--d:.8"></div>
      <p class="title-sub a fade-up" style="--d:.95">Текущее состояние, ключевые этапы и план улучшений на следующий квартал</p>
    </div>

    <svg class="process-chain" viewBox="0 0 640 560" aria-hidden="true">
      <defs>
        <linearGradient id="chainGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2f6fed"/>
          <stop offset="1" stop-color="#18b89a"/>
        </linearGradient>
      </defs>
      <path class="a draw" style="--d:.6" pathLength="1000" fill="none" stroke="url(#chainGrad)" stroke-width="4" stroke-linecap="round"
            d="M90 70 C 90 160, 330 120, 330 210 C 330 300, 110 260, 110 350 C 110 440, 350 400, 350 490"/>

      <g class="a pop" style="--d:.7">
        <circle class="node-pulse" cx="90" cy="70" r="30" fill="#2f6fed"/>
        <circle cx="90" cy="70" r="30" fill="#2f6fed"/>
        <text x="90" y="78" text-anchor="middle" class="node-label">1</text>
      </g>
      <g class="a fade-right" style="--d:.85">
        <text x="140" y="66" class="node-label">Заявка</text>
        <text x="140" y="92" class="node-caption">Инициатор</text>
      </g>

      <g class="a pop" style="--d:1.05">
        <circle cx="330" cy="210" r="30" fill="#2a86d4"/>
        <text x="330" y="218" text-anchor="middle" class="node-label">2</text>
      </g>
      <g class="a fade-right" style="--d:1.2">
        <text x="380" y="206" class="node-label">Согласование</text>
        <text x="380" y="232" class="node-caption">Руководитель</text>
      </g>

      <g class="a pop" style="--d:1.4">
        <circle cx="110" cy="350" r="30" fill="#229cba"/>
        <text x="110" y="358" text-anchor="middle" class="node-label">3</text>
      </g>
      <g class="a fade-right" style="--d:1.55">
        <text x="160" y="346" class="node-label">Закупка</text>
        <text x="160" y="372" class="node-caption">Отдел закупок</text>
      </g>

      <g class="a pop" style="--d:1.75">
        <circle class="node-pulse" cx="350" cy="490" r="30" fill="#18b89a"/>
        <circle cx="350" cy="490" r="30" fill="#18b89a"/>
        <text x="350" y="498" text-anchor="middle" class="node-label">4</text>
      </g>
      <g class="a fade-right" style="--d:1.9">
        <text x="400" y="486" class="node-label">Контроль</text>
        <text x="400" y="512" class="node-caption">Финансы</text>
      </g>
    </svg>

    <div class="title-meta">
      <div class="a fade-up" style="--d:1.2"><span>Докладчик</span><strong>Иван Иванов</strong></div>
      <div class="a fade-up" style="--d:1.3"><span>Должность</span><strong>Руководитель проекта</strong></div>
      <div class="a fade-up" style="--d:1.4"><span>Дата</span><strong>29 сентября 2026</strong></div>
    </div>
  </section>

  <script src="../assets/deck.js"></script>
</body>
</html>
